name: Performance Budget

# 2026-08-30 提速：本 workflow 3 个 job 各做一次完整 Next.js 生产构建（每次 push 共 3 遍，
# 与 ci.yml frontend-build 重复）。收敛为前端文件变更时才跑（PR）+ 每周 + 手动。
on:
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - ".github/workflows/performance.yml"
  schedule:
    - cron: "0 5 * * 1"  # Weekly Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001

      # Lighthouse 需要真实可访问的服务，否则 CHROME_INTERSTITIAL_ERROR（连接被拒）
      - name: Start server
        working-directory: frontend
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/login
            http://localhost:3000/dashboard
          budgetPath: ./frontend/budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Analyze bundle size
        run: ANALYZE=true npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001

      - name: Check bundle size
        run: |
          echo "=== Bundle Size Report ==="
          du -sh .next/
          find .next/static -name "*.js" -exec ls -lh {} \;
          find .next/static -name "*.css" -exec ls -lh {} \;

      - name: Upload bundle analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: .next/analyze/
          retention-days: 7

  core-web-vitals:
    name: Core Web Vitals Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001

      - name: Start server
        working-directory: frontend
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Check performance metrics
        run: |
          echo "=== Performance Metrics ==="
          curl -s http://localhost:3000 | wc -c
          echo "Page load check completed"

      - name: Stop server
        if: always()
        run: pkill -f "next start" || true
