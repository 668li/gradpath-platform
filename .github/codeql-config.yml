# .github/codeql-config.yml
# CodeQL 自定义配置 — 排除测试 / 迁移 / 第三方代码路径
name: "GradPath CodeQL Config"

paths:
  - backend/app
  - frontend/app
  - frontend/components
  - frontend/lib
  - frontend/stores
# 注意：不要在 paths 中列单文件（如曾经的 frontend/middleware.ts）——
# python autobuild 对文件路径做目录遍历会抛 NotADirectoryError 导致 Analyze 失败

paths-ignore:
  - backend/migrations
  - backend/tests
  - frontend/tests
  - frontend/node_modules
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"

queries:
  - uses: security-and-quality
