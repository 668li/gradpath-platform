# GradPath：扫描探测自动封禁（2026-09-04 用户拍板：5次/10分钟 → 封1小时）
[nginx-probe]
enabled  = true
# Ubuntu defaults-debian.conf 的 DEFAULT backend=systemd 会吞掉文件日志型 jail，必须显式 auto
backend  = auto
port     = 80
filter   = gradpath-probe
logpath  = /home/ubuntu/gradpath-platform/monitoring/nginx-logs/access.log
maxretry = 5
findtime = 600
bantime  = 3600
# docker 内网与回环必须豁免——封了网关=全站宕机
ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16

# GradPath：惯犯长期监禁（2026-09-06 加固：两个扫描器 IP 各打了 600-1100 次，
# 1h 刑期一到就回来）。48h 内被任一 jail 封禁 2 次 → 再封 7 天。
# 注意 banaction 用 nftables(web 端口) 而非 allports：惯犯只失去网站访问，
# 绝不碰 SSH——防止误判把自己锁在服务器外面。
[recidive]
enabled  = true
backend  = auto
filter   = recidive
logpath  = /var/log/fail2ban.log
banaction = nftables
port     = http,https
maxretry = 2
findtime = 172800
bantime  = 604800
ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
