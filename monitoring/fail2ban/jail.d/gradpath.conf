# GradPath：扫描探测自动封禁（2026-09-04 用户拍板：5次/10分钟 → 封1小时）
[nginx-probe]
enabled  = true
port     = 80
filter   = gradpath-probe
logpath  = /home/ubuntu/gradpath-platform/monitoring/nginx-logs/access.log
maxretry = 5
findtime = 600
bantime  = 3600
# docker 内网与回环必须豁免——封了网关=全站宕机
ignoreip = 127.0.0.1/8 ::1 172.16.0.0/12 10.0.0.0/8 192.168.0.0/16
