# fail2ban filter：匹配 nginx access.log 中被 444 断连的扫描器探测
# 日志格式（main_with_timing）：
# 1.2.3.4 - - [04/Sep/2026:12:00:00 +0000] "GET /.git/config HTTP/1.1" 444 0 "-" "UA" rt=...
[Definition]
failregex = ^<HOST> -.*"(GET|POST|HEAD)[^"]*(?:\.git|\.env|\.svn|\.ssh|\.php|\.asp|\.jsp|\.cgi|wp-|adminer|phpmyadmin|/shell)[^"]*" 444
ignoreregex =
