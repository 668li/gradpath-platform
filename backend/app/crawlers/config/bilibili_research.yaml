# B站考研经验视频调研爬虫配置（Phase H 扩大数据源）
# 线契约（地基③，spec 002）：schedule 已从装饰性 "weekly" 规范为真实 cron
name: bilibili_research
category: research
description: B站考研经验视频调研爬虫（多关键词，写入 PENDING 审核队列）
enabled: true
schedule: "0 3 * * 1"  # 每周一 03:00（14 关键词 × 2 页 ≈ 280 次搜索请求，02 点档之后避免叠加）
sla_hours: 168
entry: "https://api.bilibili.com/x/web-interface/search/type"
max_retries: 3
timeout_seconds: 30
pages: 2  # 每个关键词抓取页数（每页约 20 条，防风控）
# 信息差高频维度关键词（可在 admin 端 / YAML 中调整）
keywords:
  - 408 计算机考研
  - 考研数学经验
  - 考研英语经验
  - 考研政治经验
  - 考研择校
  - 考研复试经验
  - 考研调剂
  - 备考时间规划
  - 考研二战 心态
  - 考研避坑 教训
  - 考研失败 反思
  - 在职考研 经验
  - 考研二战 教训
  - 三个月考研 上岸
notes: |
  数据源：B站搜索公开 API（/x/web-interface/search/type，免登录）。
  合规：只存视频元数据（标题/作者/播放量/点赞/简介/外链），不搬视频全文；
  入库走 store_research_items → PENDING 审核队列，管理员确认后才落业务表。
  抖音/小红书不采集（登录态墙），社区投稿 API 作为替代路径。
