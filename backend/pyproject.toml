[project]
name = "gradpath-backend"
version = "0.1.0"
description = "GradPath personal career trajectory platform backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "python-json-logger>=2.0.0",
    "slowapi>=0.1.9",
    "fastapi-mcp>=0.4.0",
    "feedparser>=6.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "PyMuPDF>=1.24.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "apscheduler>=3.10.0",
    "redis>=5.0.0",
    "tenacity>=8.2.0",
    "celery[redis]>=5.3.6",
    "prometheus_client>=0.20.0",
]

# 显式声明包发现范围：backend/ 下有 app/pipeline/migrations/scripts 等多个顶级目录，
# 不声明时 setuptools flat-layout 自动发现会报 "Multiple top-level packages"，
# 导致 pip install -e / docker build 全部失败（CI 自 2026-07 起全红的根因之一）。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "isort>=5.13.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "types-python-jose>=3.3.4",
    "types-passlib>=1.7.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ===== isort: 导入语句自动排序 =====
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["app"]
known_third_party = ["fastapi", "sqlalchemy", "pydantic", "starlette"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["migrations/*", ".venv/*", "build/*", "dist/*"]

# ===== ruff: 快速 Linter + Formatter =====
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests", "pipeline"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    # "I" 已移除：import 排序由独立 isort 步骤负责（工具间规则互斥，
    #     ruff 内置 isort 与 isort CLI 对同一文件给出相反建议)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E501",  # line too long (black handles)
    "B008",  # do not perform function calls in argument defaults (FastAPI pattern)
    "B904",  # raise from in except (existing code style)
    # --- 存量技术债（2026-08 CI 首次转绿时豁免，逐步清理后移出） ---
    "E741",   # 歧义变量名 l/I/O（19 处存量）
    "E712",   # == True/False 比较（18 处存量）
    "E722",   # 裸 except（12 处存量）
    "F841",   # 未使用局部变量（39 处存量）
    "C401",   # 不必要的生成器 set()（22 处存量）
    "N806",   # 函数内大写变量名（21 处存量，多为常量表）
    "SIM105", # 用 contextlib.suppress 替代 try/except-pass（16 处存量）
    "SIM108", # if-else 改三元表达式（11 处存量）
    "B007",   # loop 控制变量未使用（17 处存量）
    "TC002",  # typing-only 三方 import 移入 TYPE_CHECKING（11 处存量）
    "TC003",  # typing-only 标准库 import 移入 TYPE_CHECKING（8 处存量）
    "B905",   # zip 未显式 strict=（5 处存量）
    "SIM102", # 嵌套 if 合并（4 处存量）
    "SIM103", # 直接返回条件表达式（2 处存量）
    "SIM115", # open 未用 context manager（Scrapy pipeline 固有模式）
    "SIM117", # 嵌套 with 合并（1 处存量）
    "C408",   # dict() 字面量改写（4 处存量，含测试）
    "C416",   # 不必要推导式（2 处存量）
    "N805",   # 方法首参非 self（ai_study_plan 遗留 2 处）
    "N811",   # 常量别名导入（UUID as PyUUID 等遗留）
    "N814",   # CamelCase 导入为常量（main.py _NM 遗留）
    "N818",   # 异常类缺 Error 后缀（AIServiceNotConfigured 等，改名波及引用方）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]  # 测试中允许非标准命名
"migrations/*" = ["E", "W", "F"]  # 迁移脚本不检查
# 采集器/导入脚本为独立运行风格（sys.path 操作后 import、数据表字面量重复 key）
"app/crawlers/**" = ["E402", "F601", "I001", "E701", "E702"]
# 环境变量加载后才能 import（settings/代理初始化依赖），import 位置有语义
"app/main.py" = ["E402"]
"app/api/mentors.py" = ["E402"]
"app/api/learning_methods.py" = ["E402"]
"tests/test_skills.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ===== black: 代码格式化 =====
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | migrations/versions
)/
'''

# ===== mypy: 类型检查（B14 收紧为 strict 模式） =====
# 文档: https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = false  # FastAPI 装饰器部分未带类型
check_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = false  # 兼容 __init__.py re-export 模式
strict_equality = true
extra_checks = true
show_error_codes = true
show_column_numbers = true
files = ["app"]

# 第三方库缺类型存根时忽略
[[tool.mypy.overrides]]
module = [
    "slowapi.*",
    "psycopg2.*",
    "feedparser.*",
    "apscheduler.*",
    "celery.*",
    "tenacity.*",
    "prometheus_client.*",
    "reportlab.*",
    "openpyxl.*",
    "fitz.*",
    "numpy.*",
    "sklearn.*",
    "bs4.*",
    "lxml.*",
    "redis.*",
    "httpx.*",
]
ignore_missing_imports = true

# pipeline 脚本：渐进式收紧
[[tool.mypy.overrides]]
module = "pipeline.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
