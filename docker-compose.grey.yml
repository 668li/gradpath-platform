# 备案通过后的正式端口覆盖（域名 quxianglab.cn，HTTPS 由容器 nginx 终结）
#   docker compose -f docker-compose.prod.yml -f docker-compose.grey.yml up -d
# 作用：
#   - 80 公网（仅 ACME 挑战 + 301 跳 https）
#   - 443 公网（TLS 主站，证书挂载自宿主机 /etc/letsencrypt）
#   - 挂载证书与 ACME webroot（续期免停机：certbot renew --webroot）
services:
  nginx:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /home/ubuntu/certbot/www:/var/www/certbot
